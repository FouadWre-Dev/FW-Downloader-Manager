
title: "🐛 Bug Report"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide as much detail as possible to help us investigate and fix the issue.

  - type: input
    id: app_version
    attributes:
      label: "FW Downloader Manager Version"
      description: "Which version are you using?"
      placeholder: "e.g. 1.4.16"
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: "Windows Version"
      description: "Which Windows version are you using?"
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "Clearly explain what went wrong."
      placeholder: "The application..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "List the steps needed to reproduce this issue."
      placeholder: |
        1. Open the application.
        2. Go to...
        3. Click...
        4. The problem occurs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Error Messages"
      description: "Attach screenshots or paste error messages if available."
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: "How often does this happen?"
      options:
        - Every time
        - Sometimes
        - Only once
        - Not sure
    validations:
      required: true
