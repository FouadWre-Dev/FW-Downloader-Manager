
title: "💡 Feature Request"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve FW Downloader Manager!
        Please describe your idea clearly so we can understand and evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: "What problem does this feature solve?"
      description: "Describe the problem or limitation you're experiencing."
      placeholder: "I'm having difficulty with..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Describe your proposed feature"
      description: "Explain how you would like this feature to work."
      placeholder: "I would like the application to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives or additional details"
      description: "Any alternative solutions, examples, or screenshots?"
      placeholder: "Additional information..."
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: "How important is this feature to you?"
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
